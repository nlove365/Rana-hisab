
name: Build Rana Hisab APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: rana-hisab-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: rana-hisab-debug-signing-key-v1

      - name: Locate Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(find /usr/local/lib/android/sdk -name sdkmanager -type f | head -n 1)
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Android project
        run: |
          mkdir -p extracted
          unzip -q Rana-Hisab-Updated-Project-2026-11-19.zip -d extracted
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/extracted/Rana-Hisab-Android" >> "$GITHUB_ENV"
          test -f extracted/Rana-Hisab-Android/settings.gradle
          test -f extracted/Rana-Hisab-Android/app/build.gradle

      - name: Sync latest app assets into Android project
        run: |
          ASSET_DIR=$(find extracted/Rana-Hisab-Android -type d -path '*/src/main/assets' | head -n 1)
          test -n "$ASSET_DIR"
          base64 -d app-icon.jpg.base64 > icon.jpg
          cp index.html manifest.webmanifest icon.svg icon.jpg "$ASSET_DIR"/
          if [ -f sw.js ]; then cp sw.js "$ASSET_DIR"/; fi
          echo "Synced latest web app files into $ASSET_DIR"
          grep -q "স্বপ্নময় ইনক বিডি" "$ASSET_DIR/index.html"

      - name: Check embedded JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script[^>]*>(.*?)</script>", html, re.I | re.S)
          if not scripts:
              raise SystemExit("No inline JavaScript found")
          for i, source in enumerate(scripts):
              path = pathlib.Path(f"/tmp/rana-script-{i}.js")
              path.write_text(source, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"PASS: syntax checked in {len(scripts)} script block(s)")
          PY
      - name: Set Android launcher icon
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import xml.etree.ElementTree as ET
          project = "extracted/Rana-Hisab-Android/app/src/main"
          manifest = os.path.join(project, "AndroidManifest.xml")
          tree = ET.parse(manifest)
          root = tree.getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")
          if app is None:
              raise SystemExit("AndroidManifest.xml has no application element")
          app.set(android + "icon", "@drawable/ic_launcher")
          app.set(android + "roundIcon", "@drawable/ic_launcher")
          ET.register_namespace("android", "http://schemas.android.com/apk/res/android")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          res = os.path.join(project, "res", "drawable-nodpi")
          os.makedirs(res, exist_ok=True)
          shutil.copyfile("icon.jpg", os.path.join(res, "ic_launcher.jpg"))
          print("New Rana Hisab logo installed as Android launcher icon.")
          PY

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Verify APK contains latest brand assets
        run: |
          APK=$(find extracted/Rana-Hisab-Android/app/build/outputs/apk/debug -name '*.apk' -type f | head -n 1)
          test -n "$APK"
          python3 - "$APK" <<'PY'
          import sys, zipfile
          apk = sys.argv[1]
          with zipfile.ZipFile(apk) as z:
              names = z.namelist()
              def find_asset(name):
                  matches = [n for n in names if n.endswith('/' + name) or n == name]
                  if not matches:
                      raise SystemExit("APK verification failed: missing " + name)
                  return matches[0]
              html_path = find_asset("index.html")
              html = z.read(html_path).decode("utf-8", "replace")
              checks = {
                  "Bangla copyright": "স্বপ্নময় ইনক বিডি" in html,
                  "new app logo reference": 'src="icon.jpg"' in html,
                  "payment persistence": "localStorage.setItem('ranaPayments'" in html,
                  "local date calculation": "dateKey=d=>" in html,
                  "POS discount validation": "ছাড় সাবটোটালের" in html,
                  "smart command confirmation": "function confirmCommand()" in html,
                  "inventory stock tracking": "function adjustStock()" in html and "stockTracked" in html,
                  "POS aggregate stock validation": "কার্টসহ পর্যাপ্ত স্টক নেই" in html and "requested[key]>available" in html,
                  "POS stock deduction": "p.stock=Number(p.stock)-requested[key]" in html,
                  "stock ledger persistence": "localStorage.setItem('ranaStockMovements'" in html,
                  "unit conversion": "function convertStockQty(q,from,to)" in html,
                  "manual transaction stock movement": "manual-'+type" in html,
                  "POS stock movement ledger": "source:'pos-sale'" in html,
                  "void stock reversal": "source:'void-reversal'" in html and "m.reversed=true" in html,
                  "stock history UI": 'id="stockHistory"' in html and "function renderStockHistory()" in html,
                  "backup stock ledger": "stockMovements:stockMovements" in html,
                  "restore stock ledger": "stockMovements=Array.isArray(d.stockMovements)" in html,
                  "POS credit sale ledger": "type:'creditSale',note:'POS বাকি বিক্রি'" in html,
                  "barcode product registration": 'id="pBarcode"' in html and "barcode" in html,
                  "POS barcode lookup": "function lookupPosBarcode()" in html,
                  "camera barcode scanning": "function startBarcodeCamera()" in html and "BarcodeDetector" in html,
                  "low stock threshold": 'id="pMinStock"' in html and "minStock" in html,
                  "low stock alerts": "function getLowStockProducts()" in html and "কম মজুত পণ্য" in html,
                  "task manager UI": 'id="tasks"' in html and "function addRanaTask()" in html and "function renderRanaTasks()" in html,
                  "task reminder": "function checkRanaTaskReminders()" in html and "requestTaskNotification()" in html,
                  "task backup restore": "tasks:ranaTasks" in html and "ranaTasks=Array.isArray(d.tasks)?d.tasks:[]" in html,
                  "financial report estimates": "function makeReport()" in html and "costUnknown++" in html and "const currentReceivable=" in html,
                  "daily monthly report": "মাসভিত্তিক হিসাব" in html and "দিনভিত্তিক হিসাব" in html,
                  "POS void credit adjustment": "linkedTxIds" in html and "creditDueAmount" in html and "discountEntry.voided=true" in html,
                  "POS void payment exclusion": "payments.filter(p=>!p.voided" in html and "p.voided=true" in html,
                  "in-app update prompt": "ranaUpdateNotice" in html and "controllerchange" in html,
              }
              for label, ok in checks.items():
                  print(("PASS: " if ok else "FAIL: ") + label)
              if not all(checks.values()):
                  raise SystemExit("APK HTML asset does not contain all required updates")
              find_asset("icon.jpg")
              print("PASS: bundled app logo")
              sw_path = find_asset("sw.js")
              sw = z.read(sw_path).decode("utf-8", "replace")
              if "rana-hisab-v11-task-reminders-1" not in sw:
                  raise SystemExit("APK verification failed: service worker cache version is outdated")
              print("PASS: service worker cache version")
          PY
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/apk-badging.txt
          grep -q '^package:' /tmp/apk-badging.txt
          grep -q 'application-icon' /tmp/apk-badging.txt
          echo "PASS: Android launcher icon resource is packaged."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rana-Hisab-APK
          path: extracted/Rana-Hisab-Android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
